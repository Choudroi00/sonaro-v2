name: Runner Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: staging
        type: choice
        options:
          - development
          - staging
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: runner-android-build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: true

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Android native project
        run: pnpm expo prebuild
        env:
          EXPO_PUBLIC_APP_ENV: ${{ inputs.profile }}

      - name: Build Android with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          if [ "${{ inputs.profile }}" = "production" ]; then
            ./gradlew bundleRelease --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.profile }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
